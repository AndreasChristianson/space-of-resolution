# spaceofresolution.com on the Envoy Gateway (k8s-resources#91). The listener
# (https-sor) and its certificate are owned by k8s-resources. Public, no auth.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sor
  namespace: sor
spec:
  parentRefs:
    - name: glowbox
      namespace: envoy-gateway-system
      sectionName: https-sor
  hostnames:
    - spaceofresolution.com
  rules:
    - backendRefs:
        - name: sor
          port: 3000
